<div class="shell" [class.sidebar-collapsed]="isSidebarCollapsed" [class.mobile-menu-open]="showMobileMenu">
  <aside class="sidebar" [class.open]="showMobileMenu" role="navigation" aria-label="Navegación principal">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12Z"/>
        </svg>
      </div>
      <div class="brand-text" *ngIf="!isSidebarCollapsed">
        <div class="brand-name">KIVA</div>
        <div class="brand-sub">Kinship, Inspiration, Voyages & Adventures</div>
      </div>
    </div>

    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Alternar menú" aria-expanded="showMobileMenu" type="button" *ngIf="isSidebarCollapsed || showMobileMenu">
      <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>

    <nav class="nav" aria-label="Menú principal">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/dashboard' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Inicio</span>
      </a>
      <a routerLink="/grupos" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/grupos' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Grupos</span>
      </a>
      <a routerLink="/viajes" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/viajes' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h6z"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Viajes</span>
      </a>
      <a routerLink="/participantes" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/participantes' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="3"/><path d="M2 21v-3a8 8 0 0 1 16 0v3"/><path d="m16.5 3.5 5 5M21.5 3.5l-5 5"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Participantes</span>
      </a>
      <a routerLink="/destinos" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/destinos' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Destinos</span>
      </a>
      <a routerLink="/itinerario" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/itinerario' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4m8-4v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Itinerario</span>
      </a>
      <a routerLink="/gastos" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/gastos' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Gastos</span>
      </a>
      <a routerLink="/votaciones" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/votaciones' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7.5 12 2.5 2.5L15.5 9"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Votaciones</span>
      </a>
      <a routerLink="/reservas" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/reservas' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5V7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5Z"/><path d="M13 5v2m0 4v2m0 4v2"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Reservas</span>
      </a>
      <a routerLink="/calendario" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url === '/calendario' ? 'page' : null">
        <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Calendario</span>
      </a>

      @if (authService.isAdmin()) {
        <div class="nav-divider" *ngIf="!isSidebarCollapsed"></div>
        <a routerLink="/admin" routerLinkActive="active" class="nav-item admin-nav-item" (click)="closeMobileMenu()" [attr.aria-current]="router.url.startsWith('/admin') ? 'page' : null">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></svg></span>
          <span class="nav-label" *ngIf="!isSidebarCollapsed">Administración</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed">
      <div class="user-mini">
        <div class="avatar" [style.background]="currentUser()?.avatarColor">{{ currentUser()?.initials }}</div>
        <div>
          <div class="user-name">{{ currentUser()?.displayName }}</div>
          <div class="user-role">{{ roleLabel(currentUser()?.role) }}</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" (click)="closeMobileMenu()" *ngIf="showMobileMenu" aria-hidden="true"></div>

  <div class="main-area">
    <header class="topbar" role="banner">
      <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Abrir menú" type="button" aria-expanded="showMobileMenu">
        <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>

      <app-search class="search-wrapper" />

      <div class="topbar-actions">
        <app-notification-dropdown />
        <app-profile-dropdown />
      </div>
    </header>

    <main class="content" role="main">
      <router-outlet />
    </main>
  </div>
</div>
