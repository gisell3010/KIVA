<div class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <img
        class="kiva-brand-logo"
        src="/assets/logo/kiva-logo.png"
        alt="Logo de KIVA"
      />

      <p class="brand-subtitle">
        Kinship, Inspiration, Voyages & Adventures
      </p>
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>

      <p class="login-desc">
        Accede a tu cuenta para organizar viajes en grupo
      </p>

      @if (error()) {
        <div
          class="error-banner"
          role="alert"
        >
          <svg
            class="ui-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
            />

            <path d="M12 8v4M12 16h.01" />
          </svg>

          {{ error() }}
        </div>
      }

      <form
        (ngSubmit)="onSubmit()"
        #loginForm="ngForm"
        class="login-form"
      >
        <div class="form-group">
          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            autocomplete="email"
            class="form-input"
            [class.error]="email && !isValidEmail(email)"
            placeholder="tu@email.com"
          />

          @if (email && !isValidEmail(email)) {
            <span class="error-text">
              Formato de email inválido
            </span>
          }
        </div>

        <div class="form-group">
          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            minlength="10"
            autocomplete="current-password"
            class="form-input"
            placeholder="••••••••"
          />
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="rememberMe"
            />

            <span class="checkbox-custom"></span>

            Recordarme
          </label>

          <a
            href="#"
            class="forgot-link"
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-full"
          [disabled]="loading() || loginForm.invalid"
        >
          @if (loading()) {
            <svg
              class="ui-icon animate-spin"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M21 12a9 9 0 11-6.219-8.56" />
            </svg>

            Iniciando sesión...
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <p class="login-footer">
        ¿No tienes cuenta?

        <a
          routerLink="/register"
          class="link-btn"
        >
          Regístrate
        </a>
      </p>
    </div>
  </div>
</div>
