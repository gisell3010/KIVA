<div class="create-page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Nuevo viaje</h1>
      <p class="page-subtitle">
        Crea un viaje para planificar con tu grupo
      </p>
    </div>

    <a
      routerLink="/viajes"
      class="btn btn-outline"
    >
      <svg
        class="ui-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>

      Volver a viajes
    </a>
  </div>

  <form
    #tripForm="ngForm"
    class="card create-form"
    (ngSubmit)="onSubmit()"
  >
    @if (error()) {
      <div
        class="error-banner"
        role="alert"
      >
        {{ error() }}
      </div>
    }

    <div class="form-grid">
      <div class="form-group full-width">
        <label for="name">
          Nombre del viaje
        </label>

        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          [(ngModel)]="name"
          required
          minlength="1"
          maxlength="150"
          placeholder="Ej. Patagonia 2026"
        />
      </div>

      <div class="form-group full-width">
        <label for="groupId">
          Grupo
        </label>

        <select
          id="groupId"
          name="groupId"
          class="form-select"
          [(ngModel)]="groupId"
          required
          [disabled]="loadingGroups()"
        >
          <option
            [ngValue]="null"
            disabled
          >
            Selecciona un grupo
          </option>

          @for (group of groups(); track group.id) {
            <option [ngValue]="group.id">
              {{ group.name }}
            </option>
          }
        </select>

        @if (loadingGroups()) {
          <span class="field-hint">
            Cargando grupos...
          </span>
        } @else if (groups().length === 0) {
          <span class="field-hint">
            No tienes grupos disponibles para crear un viaje.
          </span>
        }
      </div>

      <div class="form-group">
        <label for="startDate">
          Fecha de inicio
        </label>

        <input
          id="startDate"
          name="startDate"
          type="date"
          class="form-input"
          [(ngModel)]="startDate"
        />
      </div>

      <div class="form-group">
        <label for="endDate">
          Fecha de fin
        </label>

        <input
          id="endDate"
          name="endDate"
          type="date"
          class="form-input"
          [(ngModel)]="endDate"
          [min]="startDate || null"
        />
      </div>

      <div class="form-group full-width">
        <label for="description">
          Descripción
        </label>

        <textarea
          id="description"
          name="description"
          class="form-textarea"
          rows="4"
          [(ngModel)]="description"
          maxlength="300"
          placeholder="Describe el objetivo del viaje..."
        ></textarea>

        <span class="field-hint">
          Máximo 300 caracteres
        </span>
      </div>
    </div>

    <div class="form-actions">
      <a
        routerLink="/viajes"
        class="btn btn-ghost"
      >
        Cancelar
      </a>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="
          tripForm.invalid ||
          submitting() ||
          loadingGroups() ||
          groups().length === 0
        "
      >
        @if (submitting()) {
          <svg
            class="ui-icon animate-spin"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M21 12a9 9 0 11-6.219-8.56"
            />
          </svg>

          Creando...
        } @else {
          Crear viaje
        }
      </button>
    </div>
  </form>
</div>
